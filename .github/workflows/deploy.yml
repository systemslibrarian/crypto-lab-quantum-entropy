name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR runs may be cancelled, but a main publication must finish.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Vite 8 and Vitest 5 support current Node 22 and 24 releases.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Unit tests and pinned formula/procedure checks
        run: npm test

      - name: Build (typecheck gates the build)
        run: npm run build

      - name: Audit locked dependencies (fail on high+)
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (typecheck gates the build)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium

      # `playwright test` runs the accessibility, claims, and workshop suites.
      - name: Accessibility, claims, and workshop gate (Playwright)
        run: npm run test:a11y

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  configure-pages:
    if: github.event_name != 'pull_request'
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    steps:
      # This privileged job never checks out or executes repository code.
      - uses: actions/configure-pages@v6

  deploy:
    if: github.event_name != 'pull_request'
    needs: configure-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-deploy:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the published route
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          curl --fail --show-error --silent --location \
            --retry 10 --retry-delay 5 --retry-all-errors --max-time 15 \
            "$PAGES_URL" --output "$RUNNER_TEMP/quantum-entropy.html"
          grep -F '<title>Quantum Entropy — crypto-lab</title>' \
            "$RUNNER_TEMP/quantum-entropy.html"

  # Dependabot only. Deterministic tests and the browser gate must pass before
  # a non-major bump can merge. Major updates remain open for human review.
  dependabot-auto-merge:
    needs: [test, build]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Leave major updates for human review
        if: endsWith(steps.meta.outputs.update-type, 'semver-major')
        run: echo "Major update detected; automatic merge is intentionally disabled."

      - name: Merge a non-major bump whose gate went green
        if: ${{ !endsWith(steps.meta.outputs.update-type, 'semver-major') }}
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::error::gate passed but the merge did not land after 3 attempts"
            exit 1
          fi
          # GITHUB_TOKEN merges do not emit a push event, so dispatch the same
          # gate-and-deploy workflow explicitly and fail if dispatch fails.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
